<!doctype html><html><head><meta charset="utf-8"><title>frame-motion audio template</title></head><body><script>
/* Soundtrack written in code. The renderer calls window.renderAudio(duration, rate) and expects an AudioBuffer:
     python3 scripts/render.py audio render examples/audio-template.html out/soundtrack.wav --duration 15
   Everything is scheduled on beat times derived from BPM, so audio and seek(t) share one clock.
   Edit SCORE below. No randomness: noise comes from a seeded PRNG so every render is identical. */
const BPM = 120, BEATS_PER_BAR = 4;
const SCORE = {
  kick:  { every: 1 },                                 // a kick on every beat
  hits:  [2, 4, 6, 8, 10, 12, 14],                     // scene-change hits (seconds)
  riser: { from: 10, to: 12 },                         // riser into the strongest bar (seconds)
  bass:  { note: 41.2, everyBar: true },               // E1 pulse on each downbeat
  master: 0.45,
};

const SPB = 60 / BPM;
const beat = n => n * SPB;                             // beat index -> seconds
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function noiseBuffer(ctx, seconds, seed = 1) {
  const rnd = mulberry32(seed), n = Math.ceil(seconds * ctx.sampleRate);
  const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = rnd() * 2 - 1;
  return b;
}

// Kick: sine with fast pitch drop + short click. Peak lands at time t.
function kick(ctx, out, t, gain = 1) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g).connect(out); o.start(t); o.stop(t + 0.4);
}

// Hit: filtered noise burst + low thump, for scene changes.
function hit(ctx, out, t, gain = 0.6, seed = 7) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuffer(ctx, 0.5, seed);
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.8;
  const g = ctx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + 0.5);
  kick(ctx, out, t, gain * 0.6);
}

// Riser: noise through a rising bandpass + rising saw, ends exactly at `to`.
function riser(ctx, out, from, to, gain = 0.35, seed = 3) {
  const len = to - from;
  const s = ctx.createBufferSource(); s.buffer = noiseBuffer(ctx, len, seed);
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 4;
  f.frequency.setValueAtTime(300, from); f.frequency.exponentialRampToValueAtTime(8000, to);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, from); g.gain.exponentialRampToValueAtTime(gain, to - 0.01);
  g.gain.linearRampToValueAtTime(0, to);
  s.connect(f).connect(g).connect(out); s.start(from); s.stop(to);
  const o = ctx.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(110, from); o.frequency.exponentialRampToValueAtTime(880, to);
  const og = ctx.createGain(); og.gain.setValueAtTime(0.0001, from); og.gain.exponentialRampToValueAtTime(gain * 0.25, to - 0.01);
  og.gain.linearRampToValueAtTime(0, to);
  o.connect(og).connect(out); o.start(from); o.stop(to);
}

function bassPulse(ctx, out, t, freq, len, gain = 0.25) {
  const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = freq;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g).connect(out); o.start(t); o.stop(t + len + 0.05);
}

window.renderAudio = async function (duration, rate = 48000) {
  const ctx = new OfflineAudioContext(2, Math.ceil(duration * rate), rate);
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 4;
  const master = ctx.createGain(); master.gain.value = SCORE.master;
  master.connect(comp).connect(ctx.destination);
  const nBeats = Math.floor(duration / SPB + 1e-6);
  for (let n = 0; n < nBeats; n += SCORE.kick.every) kick(ctx, master, beat(n), n % BEATS_PER_BAR === 0 ? 1 : 0.8);
  if (SCORE.bass.everyBar) for (let n = 0; n < nBeats; n += BEATS_PER_BAR) bassPulse(ctx, master, beat(n), SCORE.bass.note, SPB * 3);
  SCORE.hits.filter(t => t < duration).forEach((t, i) => hit(ctx, master, t, 0.6, 11 + i));
  if (SCORE.riser.to <= duration) riser(ctx, master, SCORE.riser.from, SCORE.riser.to);
  return await ctx.startRendering();
};
window.ready = true;
</script></body></html>
